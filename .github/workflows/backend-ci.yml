name: Backend CI

# Build and test the Spring Boot backend on every PR and on every push to main.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Verifies the wrapper jar and caches Gradle downloads between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: backend/build/reports/tests/

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Builds backend/Dockerfile and starts it with PostgreSQL, like a deployment would.
      - name: Build image and start the stack
        run: docker compose --profile app up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after about $((i * 2)) seconds"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; exit 1

      - name: Register, then call an authenticated endpoint
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@example.test","password":"Ci-smoke-test-1","fullName":"CI Smoke"}' \
            | jq -r '.data.accessToken')
          curl -fsS http://localhost:8080/api/clients -H "Authorization: Bearer $TOKEN" | jq -e '.success == true'

      - name: Show container logs
        if: failure()
        run: docker compose --profile app logs

      - name: Stop the stack
        if: always()
        run: docker compose --profile app down -v
