spring:
  config:
    activate:
      on-profile: dev

  # PostgreSQL - Development
  datasource:
    # POSTGRES_PORT lets the Docker database use another port if 5432 is taken (see docker-compose.yml)
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/dietiary_dev
    username: dietiary
    password: dietiary123!
    driver-class-name: org.postgresql.Driver
  
  # JPA - Development
  # The schema comes from Flyway (src/main/resources/db/migration); Hibernate only checks it.
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# JWT - Development only. Production must set JWT_SECRET.
jwt:
  secret: dev-only-secret-not-for-production-0123456789

# Logging - Development
logging:
  level:
    com.dietary: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# Server - Development
server:
  port: 8081
