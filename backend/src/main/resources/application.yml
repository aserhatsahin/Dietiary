# Base configuration, used in production. Everything environment-specific comes from
# environment variables (see backend/README.md); the dev and test profiles add local values.
#
# Database: Spring reads SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD from the environment directly.

spring:
  application:
    name: dietary-backend
  
  # JPA/Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Jackson (3.x writes dates as ISO-8601 strings by default)
  jackson:
    default-property-inclusion: non_null

# Server
server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* headers from the hosting platform's proxy (correct https URLs in Swagger)
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  # Required, at least 32 bytes. No default on purpose: this repo is public.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000  # 15 minutes
  refresh-token-expiration-ms: 604800000  # 7 days

# CORS: comma-separated origins allowed to call the API from a browser (the web panel)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator: only health is exposed (/actuator/health, plus /liveness and /readiness)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI (set SPRINGDOC_API_DOCS_ENABLED=false and SPRINGDOC_SWAGGER_UI_ENABLED=false to hide)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.dietary: INFO
